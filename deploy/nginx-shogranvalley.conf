# Nginx reverse proxy for the Shogran Valley Next.js app.
# setup-server.sh replaces __DOMAIN__ and Certbot adds the HTTPS (443) block.
# On staging.* the whole site sits behind a password and is hidden from Google.

# Show real visitor IPs when traffic comes through Cloudflare.
real_ip_header CF-Connecting-IP;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

map $host $is_staging { default 0; ~^staging\. 1; }
map $is_staging $staging_auth { 0 off; 1 "Shogran Valley preview"; }
map $is_staging $robots_tag { 0 ""; 1 "noindex, nofollow"; }

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Image uploads in the admin panel are up to 16 MB.
    client_max_body_size 16m;

    # Empty on the live domain, so the header is only sent on staging.
    add_header X-Robots-Tag $robots_tag always;

    auth_basic $staging_auth;
    auth_basic_user_file /etc/nginx/.htpasswd-shogran;

    location /.well-known/acme-challenge/ { auth_basic off; root /var/www/html; }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # Long cache for built assets and the hero video.
    location /_next/static/ { proxy_pass http://127.0.0.1:3000; expires 365d; add_header Cache-Control "public, immutable"; add_header X-Robots-Tag $robots_tag always; }
    location /travel/ { proxy_pass http://127.0.0.1:3000; expires 30d; }
}
